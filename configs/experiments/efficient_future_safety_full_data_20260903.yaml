experiment_id: efficient-future-safety-full-data-20260903
question: >-
  Do detached, spatially preserved Efficient-WAM future-video tokens improve
  an independent safety head on time-matched RoboTwin risk windows?
scope: scaled_fixed_window_experiment

source:
  official_efficient_wam_commit: 2bd75a8c56acfcd5754b98c7ed313176911ccae0
  negative_dataset_root: /mnt/hdd/ziyu/maxiao/Efficient-WAM-RoboTwin-Negative-Samples
  archived_batch: batch-0002-accepted-000446-001245
  archive_restore_root: /mnt/hdd/ziyu/maxiao/Safety-Verify-WAM-Stage1/data/archive-restore-batch0002-20260903/restored
  slice_root: /mnt/hdd/ziyu/maxiao/Safety-Verify-WAM-Stage1/data/efficient-future-safety-full-c007-c008-20260903
  portable_checkpoint: /mnt/hdd/ziyu/maxiao/Safety-Verify-WAM-Stage1/checkpoints/portable-safety-joint-real-context4-v5-20260830/formal/best.pt

slice:
  train_episodes: 496
  eval_episodes: 140
  train_windows: 992
  eval_windows: 280
  conditions: [7, 8]
  action_count: 16
  action_stride_frames: 3
  seed: 20260903

efficient_features:
  source: final_layer_future_video_value_tokens
  preserve_spatial_tokens: true
  detach: true
  candidate_conditioning: clean_candidate_action_at_action_t_zero
  num_video_steps: 2
  num_video_frames: 8
  model_checkpoint: /mnt/hdd/ziyu/maxiao/Safety-Verify-WAM-Stage1/checkpoints/Efficient-WAM_RoboTwin/Efficient-WAM/Efficient-WAM_stage3.pt
  deploy_config: /mnt/hdd/ziyu/maxiao/Safety-Verify-WAM-Stage1/configs/efficient_robotwin_task_eval_resolved.yml

safety_adapter:
  future_dim: 2048
  model_dim: 128
  attention_heads: 4
  dropout: 0.0
  zero_initialized_output: true
  freeze_efficient_wam: true
  freeze_portable_safety_core: true
  required_inputs: [current_rgb, current_robot_state, candidate_action_chunk]

training:
  modes: [full, mean]
  diagnostic_modes: [none, shuffled]
  seeds: [7, 17, 27]
  steps: 2000
  batch_size: 8
  learning_rate: 0.0003
  weight_decay: 0.001
  chunk_loss_weight: 1.0
  step_loss_weight: 0.35

signal_check:
  primary_metric: held_out_average_precision
  requires_full_above_no_future: true
  requires_full_above_shuffled_future: true
  report_full_vs_spatial_mean: true
