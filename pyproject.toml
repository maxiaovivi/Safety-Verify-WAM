[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-verify-wam"
version = "0.1.0"
description = "Image-action risk verification with Efficient-WAM future latent imagination"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "torch>=2.7,<2.8",
]

[project.scripts]
safety-wam-train = "safety_verify_wam.training.train:main"
safety-wam-infer = "safety_verify_wam.inference.infer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
