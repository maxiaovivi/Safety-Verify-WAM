schema_version: 1
experiment: editor-only-gt-response-kd-s200
purpose: Test whether AHA action-response supervision improves the GT-trained editor's closed-loop behavior.

source:
  shared_main_commit: f3feaf7
  efficient_wam_commit: 2bd75a8c56acfcd5754b98c7ed313176911ccae0
  aha_wam_commit: 471b981
  initialization: GT-only Stage 1 step 2000

model:
  final_architecture: Efficient-sized OVCR-S student
  target_source: ground_truth_with_aha_response
  trainable_scope: query_encoder_and_cache_editor
  freeze_action_expert: true
  action_flow_target: ground_truth
  action_noise_sampling: uniform_shifted
  num_train_timesteps: 1000
  action_sigma_shift: 5.0
  efficient_video_steps: 2
  response_layers: [3, 6, 9, 12]
  aha_layer_mapping: [4, 11, 20, 30]
  response_projection_dim: 256

loss:
  velocity_weight: 1.0
  teacher_action_weight: 0.0
  ground_truth_action_weight: 0.0
  preservation_weight: 0.0
  query_weight: 0.0
  route_weight: 0.0
  delta_weight: 0.0
  response_weight: 0.2

optimization:
  batch_size: 32
  gradient_accumulation_steps: 1
  resume_from_global_step: 2000
  additional_steps: 200
  trainer_max_steps: 2200
  learning_rate: 5.0e-5
  weight_decay: 1.0e-3
  adam_betas: [0.9, 0.95]
  scheduler: constant
  mixed_precision: bf16
  student_parameter_dtype: float32
  max_grad_norm: 1.0
  seed: 42

data:
  dataset: RoboTwin2.0
  train_windows_reported_by_loader: 6011575
  validation_windows_reported_by_loader: 63528
  sampled_train_windows: 6400
  prompt_plan: reuse the deterministic seed-42 GT-only prefix

artifacts:
  resolved_config: stage1_editor_gt_response_kd02_b32_s200_seed42.yaml
  run_name: stage1-editor-gt-response-kd02-b32-s200-seed42
  checkpoint: step_002200.pt
  save_every_steps: 200
  evaluate_every_steps: 200
